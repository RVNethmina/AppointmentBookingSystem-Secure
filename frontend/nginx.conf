server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # uploads are limited to 2 MB by the API
    client_max_body_size 3m;

    # Content Security Policy: only this origin plus the Google sign-in
    # (script, iframe, styles), Razorpay checkout, Google Fonts and the image
    # hosts the app displays.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://api.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Google sign-in needs the origin in the Referer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # allows the Google sign-in popup to talk back to this window
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        # overwrite (never append to) any client-supplied X-Forwarded-For,
        # so the API's rate limiter sees the real client address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
